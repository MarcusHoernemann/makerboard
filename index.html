<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Makerboard</title>
    
    <!-- PWA Verknüpfungen (Installierbarkeit für Android/Linux) -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#10b981" />
    <link rel="apple-touch-icon" href="logo.png" />
    
    <!-- Tailwind CSS laden -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM laden -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel laden (Übersetzt den JSX-Code direkt im Browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans selection:bg-emerald-500/30">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icons = {
            Plus: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            ),
            Check: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            ),
            Trash: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            ),
            ArrowLeft: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            ),
            Clock: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            ),
            Edit: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            ),
            ArrowUp: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
            ),
            ArrowDown: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
            )
        };

        const Dashboard = ({ projects, onCreateProject, onOpenProject, onDeleteProject, onEditProject }) => {
            const [newProjectName, setNewProjectName] = useState('');
            const [editingId, setEditingId] = useState(null);
            const [editName, setEditName] = useState('');

            const handleCreate = (e) => {
                e.preventDefault();
                if (newProjectName.trim()) {
                    onCreateProject(newProjectName);
                    setNewProjectName('');
                }
            };

            return (
                <div className="max-w-3xl mx-auto p-4 sm:p-6">
                    <header className="mb-8 mt-4">
                        <h1 className="text-3xl font-bold text-emerald-500 tracking-tight">Makerboard</h1>
                        <p className="text-slate-400 mt-2">Manage deine Maker-Projekte und Timelines.</p>
                    </header>

                    <form onSubmit={handleCreate} className="mb-8 flex gap-3">
                        <input
                            type="text"
                            value={newProjectName}
                            onChange={(e) => setNewProjectName(e.target.value)}
                            placeholder="Neues Projekt (z.B. Roboterarm)..."
                            className="flex-1 bg-slate-800 border border-slate-700 text-slate-100 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all"
                        />
                        <button
                            type="submit"
                            disabled={!newProjectName.trim()}
                            className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 disabled:cursor-not-allowed text-white px-5 py-3 rounded-xl font-medium flex items-center gap-2 transition-colors shadow-lg shadow-emerald-900/20"
                        >
                            <Icons.Plus /> <span className="hidden sm:inline">Erstellen</span>
                        </button>
                    </form>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {projects.length === 0 ? (
                            <div className="col-span-full text-center py-12 text-slate-500 bg-slate-800/50 rounded-2xl border border-slate-800">
                                Noch keine Projekte angelegt. Starte dein erstes Projekt!
                            </div>
                        ) : (
                            projects.map(project => {
                                const total = project.sections?.length || 0;
                                const completed = project.sections?.filter(s => s.completed).length || 0;
                                const progress = total === 0 ? 0 : Math.round((completed / total) * 100);
                                const isCompleted = total > 0 && progress === 100;

                                return (
                                    <div 
                                        key={project.id} 
                                        onClick={() => { if(editingId !== project.id) onOpenProject(project); }}
                                        className={`border p-5 rounded-2xl cursor-pointer hover:shadow-xl transition-all group relative ${
                                            isCompleted 
                                                ? 'bg-emerald-900/10 border-emerald-500/30 hover:border-emerald-400 hover:shadow-emerald-900/20' 
                                                : 'bg-slate-800 border-slate-700 hover:border-emerald-500 hover:shadow-emerald-900/10'
                                        }`}
                                    >
                                        <div className="flex justify-between items-start mb-4">
                                            {editingId === project.id ? (
                                                <input 
                                                    type="text" 
                                                    value={editName}
                                                    autoFocus
                                                    onChange={(e) => setEditName(e.target.value)}
                                                    onBlur={() => {
                                                        if (editName.trim() && editName !== project.name) onEditProject(project.id, editName.trim());
                                                        setEditingId(null);
                                                    }}
                                                    onKeyDown={(e) => {
                                                        if (e.key === 'Enter') {
                                                            if (editName.trim() && editName !== project.name) onEditProject(project.id, editName.trim());
                                                            setEditingId(null);
                                                        }
                                                        if (e.key === 'Escape') setEditingId(null);
                                                    }}
                                                    className="text-xl font-semibold bg-slate-900 text-slate-100 border border-emerald-500 rounded px-2 py-1 w-full mr-12 focus:outline-none"
                                                    onClick={(e) => e.stopPropagation()}
                                                />
                                            ) : (
                                                <h2 className="text-xl font-semibold text-slate-100 pr-16 flex items-center gap-3 flex-wrap">
                                                    {project.name}
                                                    {isCompleted && (
                                                        <span className="text-xs font-bold uppercase tracking-wider bg-emerald-500 text-slate-900 px-2 py-1 rounded-md">
                                                            Fertig
                                                        </span>
                                                    )}
                                                </h2>
                                            )}
                                            
                                            <div className="absolute top-4 right-4 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                <button 
                                                    onClick={(e) => {
                                                        e.stopPropagation();
                                                        setEditingId(project.id);
                                                        setEditName(project.name);
                                                    }}
                                                    className="text-slate-500 hover:text-emerald-400 p-2 bg-slate-800/80 rounded-lg backdrop-blur-sm"
                                                >
                                                    <Icons.Edit />
                                                </button>
                                                <button 
                                                    onClick={(e) => {
                                                        e.stopPropagation();
                                                        onDeleteProject(project.id);
                                                    }}
                                                    className="text-slate-500 hover:text-red-400 p-2 bg-slate-800/80 rounded-lg backdrop-blur-sm"
                                                >
                                                    <Icons.Trash />
                                                </button>
                                            </div>
                                        </div>
                                        
                                        <div className="flex justify-between text-sm text-slate-400 mb-2">
                                            <span>{completed} von {total} Abschnitten</span>
                                            <span>{progress}%</span>
                                        </div>
                                        <div className="w-full bg-slate-900 rounded-full h-2.5 overflow-hidden">
                                            <div 
                                                className="bg-emerald-500 h-2.5 rounded-full transition-all duration-700 ease-out" 
                                                style={{ width: `${progress}%` }}
                                            ></div>
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </div>
                </div>
            );
        };

        const ProjectTimeline = ({ project, onBack, onAddSection, onToggleSection, onDeleteSection, onEditSection, onMoveSection }) => {
            const [newTitle, setNewTitle] = useState('');
            const [newDuration, setNewDuration] = useState('');
            const [newDescription, setNewDescription] = useState('');

            const [editingId, setEditingId] = useState(null);
            const [editData, setEditData] = useState({ title: '', duration: '', description: '' });

            const handleAdd = (e) => {
                e.preventDefault();
                if (newTitle.trim()) {
                    onAddSection(project.id, newTitle, newDuration, newDescription);
                    setNewTitle('');
                    setNewDuration('');
                    setNewDescription('');
                }
            };

            const handleSaveEdit = (sectionId) => {
                if (editData.title.trim()) {
                    onEditSection(project.id, sectionId, {
                        title: editData.title.trim(),
                        duration: editData.duration,
                        description: editData.description
                    });
                }
                setEditingId(null);
            };

            const sections = project.sections || [];
            const totalHours = sections.reduce((sum, sec) => sum + (parseFloat(sec.duration) || 0), 0);

            return (
                <div className="max-w-3xl mx-auto p-4 sm:p-6 flex flex-col h-screen">
                    <header className="flex items-center gap-4 mb-8 mt-4 pb-4 border-b border-slate-800">
                        <button onClick={onBack} className="p-2 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-full transition-colors">
                            <Icons.ArrowLeft />
                        </button>
                        <div className="flex-1">
                            <h1 className="text-2xl sm:text-3xl font-bold text-slate-100">{project.name}</h1>
                            {totalHours > 0 && (
                                <div className="flex items-center gap-1 text-slate-400 mt-1 text-sm">
                                    <Icons.Clock /> Gesamtzeit: ~{totalHours} Stunden
                                </div>
                            )}
                        </div>
                    </header>

                    <div className="flex-1 overflow-y-auto pb-36">
                        {sections.length === 0 ? (
                            <div className="text-center py-12 text-slate-500">
                                Füge deinen ersten Projekt-Abschnitt hinzu (z.B. CAD Zeichnung).
                            </div>
                        ) : (
                            <div className="relative pl-6 sm:pl-8">
                                <div className="absolute left-10 sm:left-12 top-6 bottom-6 w-0.5 bg-slate-700"></div>
                                <ul className="space-y-4 relative z-10">
                                    {sections.map((section, index) => (
                                        <li key={section.id} className="flex items-center gap-4 sm:gap-6 group">
                                            <button 
                                                onClick={() => onToggleSection(project.id, section.id, !section.completed)}
                                                className={`shrink-0 w-8 h-8 rounded-full border-2 flex items-center justify-center transition-all duration-300 relative z-10 shadow-lg ${
                                                    section.completed 
                                                        ? 'bg-emerald-500 border-emerald-500 text-slate-900 shadow-emerald-500/30' 
                                                        : 'bg-slate-900 border-slate-500 text-transparent hover:border-emerald-400'
                                                }`}
                                            >
                                                <Icons.Check />
                                            </button>

                                            <div className={`flex-1 p-4 rounded-2xl border transition-all duration-300 ${
                                                section.completed 
                                                    ? 'bg-slate-800/40 border-slate-700/50 opacity-60' 
                                                    : 'bg-slate-800 border-slate-600 shadow-md hover:border-slate-500'
                                            }`}>
                                                {editingId === section.id ? (
                                                    <div className="flex flex-col gap-3">
                                                        <div className="flex gap-2">
                                                            <input 
                                                                type="text" 
                                                                value={editData.title} 
                                                                onChange={e => setEditData({...editData, title: e.target.value})}
                                                                className="flex-1 bg-slate-900 border border-slate-700 text-slate-100 rounded-lg px-3 py-2 focus:border-emerald-500 focus:outline-none"
                                                                placeholder="Titel"
                                                            />
                                                            <input 
                                                                type="number" 
                                                                step="0.5" min="0"
                                                                value={editData.duration} 
                                                                onChange={e => setEditData({...editData, duration: e.target.value})}
                                                                className="w-20 bg-slate-900 border border-slate-700 text-slate-100 rounded-lg px-3 py-2 focus:border-emerald-500 focus:outline-none text-center"
                                                                placeholder="Std."
                                                            />
                                                        </div>
                                                        <textarea
                                                            value={editData.description}
                                                            onChange={e => setEditData({...editData, description: e.target.value})}
                                                            className="w-full bg-slate-900 border border-slate-700 text-slate-100 rounded-lg px-3 py-2 focus:border-emerald-500 focus:outline-none resize-none text-sm"
                                                            placeholder="Beschreibung (optional)..."
                                                            rows="2"
                                                        ></textarea>
                                                        <div className="flex gap-2 justify-end">
                                                            <button onClick={() => setEditingId(null)} className="px-3 py-1.5 text-sm text-slate-400 hover:text-slate-200">Abbrechen</button>
                                                            <button onClick={() => handleSaveEdit(section.id)} className="px-3 py-1.5 text-sm bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg">Speichern</button>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div className="flex justify-between items-start">
                                                        <div className="flex flex-col">
                                                            <span className={`text-lg font-medium transition-all ${
                                                                section.completed ? 'line-through text-slate-500' : 'text-slate-100'
                                                            }`}>
                                                                {section.title}
                                                            </span>
                                                            {section.duration && (
                                                                <span className="text-xs text-slate-400 mt-1 flex items-center gap-1">
                                                                    <Icons.Clock /> {section.duration} Std.
                                                                </span>
                                                            )}
                                                            {section.description && (
                                                                <p className="text-sm text-slate-400 mt-2 whitespace-pre-wrap leading-relaxed">
                                                                    {section.description}
                                                                </p>
                                                            )}
                                                        </div>
                                                        <div className="flex flex-col sm:flex-row gap-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity ml-4 shrink-0">
                                                            <button 
                                                                onClick={(e) => { e.stopPropagation(); onMoveSection(project.id, index, -1); }}
                                                                disabled={index === 0}
                                                                className="text-slate-500 hover:text-emerald-400 disabled:opacity-20 disabled:hover:text-slate-500 p-2 rounded-xl hover:bg-slate-700/50 transition-colors"
                                                            >
                                                                <Icons.ArrowUp />
                                                            </button>
                                                            <button 
                                                                onClick={(e) => { e.stopPropagation(); onMoveSection(project.id, index, 1); }}
                                                                disabled={index === sections.length - 1}
                                                                className="text-slate-500 hover:text-emerald-400 disabled:opacity-20 disabled:hover:text-slate-500 p-2 rounded-xl hover:bg-slate-700/50 transition-colors"
                                                            >
                                                                <Icons.ArrowDown />
                                                            </button>
                                                            <button 
                                                                onClick={() => {
                                                                    setEditingId(section.id);
                                                                    setEditData({ title: section.title, duration: section.duration || '', description: section.description || '' });
                                                                }}
                                                                className="text-slate-500 hover:text-emerald-400 p-2 rounded-xl hover:bg-slate-700/50 transition-colors"
                                                            >
                                                                <Icons.Edit />
                                                            </button>
                                                            <button 
                                                                onClick={() => onDeleteSection(project.id, section.id)}
                                                                className="text-slate-500 hover:text-red-400 p-2 rounded-xl hover:bg-slate-700/50 transition-colors"
                                                            >
                                                                <Icons.Trash />
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        )}
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 p-4 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 z-50">
                        <form onSubmit={handleAdd} className="max-w-3xl mx-auto flex flex-col gap-2">
                            <div className="flex gap-2 sm:gap-3">
                                <input
                                    type="text"
                                    value={newTitle}
                                    onChange={(e) => setNewTitle(e.target.value)}
                                    placeholder="Neuer Abschnitt..."
                                    className="flex-1 bg-slate-800 border border-slate-700 text-slate-100 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500"
                                />
                                <input
                                    type="number"
                                    step="0.5"
                                    min="0"
                                    value={newDuration}
                                    onChange={(e) => setNewDuration(e.target.value)}
                                    placeholder="Std."
                                    className="w-20 bg-slate-800 border border-slate-700 text-slate-100 rounded-xl px-3 py-3 focus:outline-none focus:border-emerald-500 text-center"
                                />
                                <button
                                    type="submit"
                                    disabled={!newTitle.trim()}
                                    className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white px-4 sm:px-6 py-3 rounded-xl font-medium transition-colors"
                                >
                                    <Icons.Plus />
                                </button>
                            </div>
                            <input
                                type="text"
                                value={newDescription}
                                onChange={(e) => setNewDescription(e.target.value)}
                                placeholder="Optionale Beschreibung / Notizen..."
                                className="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-emerald-500"
                            />
                        </form>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [projects, setProjects] = useState([]);
            const [currentProjectId, setCurrentProjectId] = useState(null);
            const [loading, setLoading] = useState(true);

            // Daten aus dem lokalen Speicher laden (Perfekt für Standalone GitHub Pages)
            useEffect(() => {
                const savedProjects = localStorage.getItem('makerboard_projects');
                if (savedProjects) {
                    try {
                        setProjects(JSON.parse(savedProjects));
                    } catch (e) {
                        console.error("Konnte Projekte nicht laden", e);
                    }
                }
                setLoading(false);
            }, []);

            // Daten bei jeder Änderung im lokalen Speicher sichern
            useEffect(() => {
                if (!loading) {
                    localStorage.setItem('makerboard_projects', JSON.stringify(projects));
                }
            }, [projects, loading]);

            const handleCreateProject = (name) => {
                const newProject = {
                    id: crypto.randomUUID(),
                    name: name,
                    createdAt: Date.now(),
                    sections: []
                };
                setProjects(prev => [newProject, ...prev]);
            };

            const handleDeleteProject = (id) => {
                setProjects(prev => prev.filter(p => p.id !== id));
                if (currentProjectId === id) setCurrentProjectId(null);
            };

            const handleEditProject = (id, newName) => {
                setProjects(prev => prev.map(p => p.id === id ? { ...p, name: newName } : p));
            };

            const handleAddSection = (projectId, title, duration, description) => {
                const newSection = {
                    id: crypto.randomUUID(),
                    title: title,
                    duration: duration || null,
                    description: description || '',
                    completed: false,
                    createdAt: Date.now()
                };
                setProjects(prev => prev.map(p => p.id === projectId ? { ...p, sections: [...(p.sections || []), newSection] } : p));
            };

            const handleEditSection = (projectId, sectionId, updates) => {
                setProjects(prev => prev.map(p => {
                    if (p.id !== projectId) return p;
                    return {
                        ...p,
                        sections: p.sections.map(sec => sec.id === sectionId ? { ...sec, ...updates } : sec)
                    };
                }));
            };

            const handleToggleSection = (projectId, sectionId, isCompleted) => {
                setProjects(prev => prev.map(p => {
                    if (p.id !== projectId) return p;
                    return {
                        ...p,
                        sections: p.sections.map(sec => sec.id === sectionId ? { ...sec, completed: isCompleted } : sec)
                    };
                }));
            };

            const handleDeleteSection = (projectId, sectionId) => {
                setProjects(prev => prev.map(p => {
                    if (p.id !== projectId) return p;
                    return {
                        ...p,
                        sections: p.sections.filter(sec => sec.id !== sectionId)
                    };
                }));
            };

            const handleMoveSection = (projectId, index, direction) => {
                setProjects(prev => prev.map(p => {
                    if (p.id !== projectId) return p;
                    const newSections = [...p.sections];
                    const newIndex = index + direction;
                    if (newIndex < 0 || newIndex >= newSections.length) return p;
                    
                    const temp = newSections[index];
                    newSections[index] = newSections[newIndex];
                    newSections[newIndex] = temp;
                    return { ...p, sections: newSections };
                }));
            };

            if (loading) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-500"></div>
                    </div>
                );
            }

            const currentProject = projects.find(p => p.id === currentProjectId);

            return (
                <div>
                    {currentProjectId && currentProject ? (
                        <ProjectTimeline 
                            project={currentProject} 
                            onBack={() => setCurrentProjectId(null)}
                            onAddSection={handleAddSection}
                            onToggleSection={handleToggleSection}
                            onDeleteSection={handleDeleteSection}
                            onEditSection={handleEditSection}
                            onMoveSection={handleMoveSection}
                        />
                    ) : (
                        <Dashboard 
                            projects={projects}
                            onCreateProject={handleCreateProject}
                            onOpenProject={(proj) => setCurrentProjectId(proj.id)}
                            onDeleteProject={handleDeleteProject}
                            onEditProject={handleEditProject}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
