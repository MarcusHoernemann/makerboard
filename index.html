<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="theme-color" content="#0f172a">
    <title>Makerboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM laden (Fehlte) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel für JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK (Version 11) via ES Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // Globale Bereitstellung für das React-Skript
        window.FB = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc };
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans selection:bg-blue-500/30 fixed inset-0 w-full h-[100dvh] overflow-hidden m-0 p-0 flex flex-col">
    <div id="root" class="w-full h-full flex flex-col flex-1 min-h-0"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icons = {
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            ArrowLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>,
            Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
            ArrowUp: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>,
            ArrowDown: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>,
            Flag: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>,
            Cloud: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>,
            CloudOff: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22.61 16.95A4.5 4.5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 15h9a4.5 4.5 0 0 0 1.95-.45"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>,
            Refresh: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        };

        const URGENCY_LEVELS = {
            1: { label: 'Priorität 1', colorClass: 'text-red-400', bgClass: 'bg-red-400/10 border-red-400/20' },
            2: { label: 'Priorität 2', colorClass: 'text-orange-400', bgClass: 'bg-orange-400/10 border-orange-400/20' },
            3: { label: 'Priorität 3', colorClass: 'text-yellow-400', bgClass: 'bg-yellow-400/10 border-yellow-400/20' },
            4: { label: 'Priorität 4', colorClass: 'text-blue-400', bgClass: 'bg-blue-400/10 border-blue-400/20' },
            5: { label: 'Priorität 5', colorClass: 'text-slate-400', bgClass: 'bg-slate-400/10 border-slate-400/20' }
        };

        const SyncModal = ({ isOpen, onClose, syncCode, onApplySyncCode }) => {
            const [inputCode, setInputCode] = useState('');
            
            useEffect(() => {
                if (isOpen) setInputCode('');
            }, [isOpen]);

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md flex flex-col shadow-2xl overflow-hidden">
                        <div className="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/90">
                            <h2 className="font-bold text-lg text-slate-100 flex items-center gap-2">
                                <Icons.Cloud /> Geräte-Synchronisation
                            </h2>
                            <button onClick={onClose} className="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition-colors">
                                <Icons.X />
                            </button>
                        </div>
                        <div className="p-6 space-y-6">
                            <div>
                                <p className="text-sm text-slate-400 mb-2">Dein aktueller Sync-Code lautet:</p>
                                <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 text-center relative group">
                                    <span className="text-3xl font-mono font-bold tracking-widest text-blue-400 select-all">{syncCode}</span>
                                </div>
                                <p className="text-xs text-slate-500 mt-2">
                                    Gib diesen Code auf einem anderen Gerät (z.B. Handy oder Tablet) ein, um die Projekte in Echtzeit zu synchronisieren.
                                </p>
                            </div>
                            <div className="border-t border-slate-800 pt-6">
                                <p className="text-sm text-slate-400 mb-2">Anderes Gerät verknüpfen:</p>
                                <div className="flex gap-2">
                                    <input 
                                        type="text" 
                                        value={inputCode} 
                                        onChange={(e) => setInputCode(e.target.value.toUpperCase())}
                                        placeholder="Sync-Code eingeben..."
                                        maxLength={8}
                                        className="flex-1 bg-slate-950 border border-slate-800 text-slate-100 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 font-mono text-center uppercase"
                                    />
                                    <button 
                                        onClick={() => {
                                            if (inputCode.trim().length >= 4) {
                                                onApplySyncCode(inputCode.trim());
                                                onClose();
                                            }
                                        }}
                                        disabled={inputCode.trim().length < 4}
                                        className="bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition-all"
                                    >
                                        Anwenden
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ projects, onCreateProject, onOpenProject, onDeleteProject, onEditProject, onOpenSync, syncStatus }) => {
            const [newProjectName, setNewProjectName] = useState('');
            const [newProjectUrgency, setNewProjectUrgency] = useState(3);
            const [editingId, setEditingId] = useState(null);
            const [editName, setEditName] = useState('');
            const [editUrgency, setEditUrgency] = useState(3);

            const handleCreate = (e) => {
                e.preventDefault();
                if (newProjectName.trim()) {
                    onCreateProject(newProjectName, newProjectUrgency);
                    setNewProjectName('');
                    setNewProjectUrgency(3);
                }
            };

            const startEditing = (project) => {
                setEditingId(project.id);
                setEditName(project.name);
                setEditUrgency(project.urgency || 3);
            };

            const saveEditing = (projectId) => {
                if (editName.trim()) {
                    onEditProject(projectId, { name: editName.trim(), urgency: editUrgency });
                }
                setEditingId(null);
            };

            return (
                <div className="flex-1 flex flex-col w-full max-w-3xl mx-auto min-h-0 relative">
                    <div className="flex-1 overflow-y-auto min-h-0 p-4 sm:p-6 pb-20">
                        
                        <header className="mb-8 mt-2 flex flex-wrap justify-between items-center gap-4">
                            <div>
                                <h1 className="text-3xl font-bold text-blue-500 tracking-tight flex items-center gap-2">
                                    Makerboard
                                </h1>
                                <p className="text-xs text-slate-400 mt-1">Projektfortschritt & Cloud Sync</p>
                            </div>

                            <button 
                                onClick={onOpenSync}
                                className={`px-4 py-2.5 rounded-xl border font-medium text-xs sm:text-sm flex items-center gap-2 transition-all shadow-lg ${
                                    syncStatus === 'connected' 
                                        ? 'bg-blue-500/10 border-blue-500/30 text-blue-400 hover:bg-blue-500/20' 
                                        : syncStatus === 'connecting'
                                        ? 'bg-amber-500/10 border-amber-500/30 text-amber-400'
                                        : 'bg-red-500/10 border-red-500/30 text-red-400 hover:bg-red-500/20'
                                }`}
                            >
                                {syncStatus === 'connected' ? <Icons.Cloud /> : syncStatus === 'connecting' ? <Icons.Refresh /> : <Icons.CloudOff />}
                                <span className="hidden sm:inline">
                                    {syncStatus === 'connected' ? 'Cloud Verbunden' : syncStatus === 'connecting' ? 'Verbinde...' : 'Offline'}
                                </span>
                            </button>
                        </header>

                        <form onSubmit={handleCreate} className="mb-8 flex flex-col sm:flex-row gap-3">
                            <input
                                type="text"
                                value={newProjectName}
                                onChange={(e) => setNewProjectName(e.target.value)}
                                placeholder="Neues Projekt (z.B. Roboterarm)..."
                                className="flex-1 bg-slate-800 border border-slate-700 text-slate-100 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition-all text-base"
                            />
                            <select
                                value={newProjectUrgency}
                                onChange={(e) => setNewProjectUrgency(Number(e.target.value))}
                                className="bg-slate-800 border border-slate-700 text-slate-100 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition-all cursor-pointer text-base"
                            >
                                {Object.entries(URGENCY_LEVELS).map(([key, config]) => (
                                    <option key={key} value={key}>{config.label}</option>
                                ))}
                            </select>
                            <button
                                type="submit"
                                disabled={!newProjectName.trim()}
                                className="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white px-5 py-3 rounded-xl font-medium flex items-center justify-center gap-2 shadow-lg shadow-blue-900/20"
                            >
                                <Icons.Plus /> <span className="hidden sm:inline">Erstellen</span>
                            </button>
                        </form>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {projects.length === 0 ? (
                                <div className="col-span-full text-center py-12 text-slate-500 bg-slate-800/50 rounded-2xl border border-slate-800">
                                    Noch keine Projekte angelegt. Starte dein erstes Projekt!
                                </div>
                            ) : (
                                projects.map(project => {
                                    const total = project.sections?.length || 0;
                                    const completed = project.sections?.filter(s => s.completed).length || 0;
                                    const progress = total === 0 ? 0 : Math.round((completed / total) * 100);
                                    const isCompleted = total > 0 && progress === 100;
                                    const currentUrgency = project.urgency || 3;

                                    return (
                                        <div 
                                            key={project.id} 
                                            onClick={() => { if(editingId !== project.id) onOpenProject(project); }}
                                            className={`border p-5 rounded-2xl cursor-pointer hover:shadow-xl transition-all group relative ${
                                                isCompleted ? 'bg-blue-900/10 border-blue-500/30' : 'bg-slate-800 border-slate-700'
                                            }`}
                                        >
                                            <div className="flex justify-between items-start mb-4">
                                                {editingId === project.id ? (
                                                    <div className="flex flex-col gap-3 w-full pr-8" onClick={e => e.stopPropagation()}>
                                                        <input 
                                                            type="text" value={editName} autoFocus onChange={(e) => setEditName(e.target.value)}
                                                            className="text-lg font-semibold bg-slate-900 text-slate-100 border border-blue-500 rounded px-3 py-2 w-full focus:outline-none"
                                                        />
                                                        <select 
                                                            value={editUrgency} onChange={(e) => setEditUrgency(Number(e.target.value))}
                                                            className="bg-slate-900 text-slate-100 border border-slate-700 rounded px-3 py-2 w-full focus:outline-none focus:border-blue-500 text-sm"
                                                        >
                                                            {Object.entries(URGENCY_LEVELS).map(([key, config]) => (
                                                                <option key={key} value={key}>{config.label}</option>
                                                            ))}
                                                        </select>
                                                        <div className="flex gap-2">
                                                            <button onClick={() => saveEditing(project.id)} className="px-3 py-1.5 text-sm bg-blue-600 hover:bg-blue-500 text-white rounded font-medium">Speichern</button>
                                                            <button onClick={() => setEditingId(null)} className="px-3 py-1.5 text-sm bg-slate-700 hover:bg-slate-600 text-slate-200 rounded">Abbrechen</button>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <>
                                                        <div className="flex flex-col gap-2 pr-12">
                                                            <h2 className="text-xl font-semibold text-slate-100 flex items-center gap-3 flex-wrap">
                                                                {project.name}
                                                                {isCompleted && <span className="text-xs font-bold uppercase bg-blue-500 text-slate-900 px-2 py-1 rounded-md">Fertig</span>}
                                                            </h2>
                                                            <div className={`inline-flex w-max items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium border ${URGENCY_LEVELS[currentUrgency].bgClass} ${URGENCY_LEVELS[currentUrgency].colorClass}`}>
                                                                <Icons.Flag /> {URGENCY_LEVELS[currentUrgency].label}
                                                            </div>
                                                        </div>
                                                        <div className="absolute top-4 right-4 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                            <button onClick={(e) => { e.stopPropagation(); startEditing(project); }} className="text-slate-500 hover:text-blue-400 p-2"><Icons.Edit /></button>
                                                            <button onClick={(e) => { e.stopPropagation(); onDeleteProject(project.id); }} className="text-slate-500 hover:text-red-400 p-2"><Icons.Trash /></button>
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                            <div className="flex justify-between text-sm text-slate-400 mb-2">
                                                <span>{completed} von {total} Abschnitten</span>
                                                <span>{progress}%</span>
                                            </div>
                                            <div className="w-full bg-slate-900 rounded-full h-2.5 overflow-hidden">
                                                <div className="bg-blue-500 h-2.5 rounded-full transition-all" style={{ width: `${progress}%` }}></div>
                                            </div>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const ProjectTimeline = ({ project, onBack, onAddSection, onToggleSection, onDeleteSection, onEditSection, onMoveSection }) => {
            const [newTitle, setNewTitle] = useState('');
            const [newDuration, setNewDuration] = useState('');
            const [newDescription, setNewDescription] = useState('');
            const [editingId, setEditingId] = useState(null);
            const [editData, setEditData] = useState({ title: '', duration: '', description: '' });

            const handleAdd = (e) => {
                e.preventDefault();
                if (newTitle.trim()) {
                    onAddSection(project.id, newTitle, newDuration, newDescription);
                    setNewTitle(''); setNewDuration(''); setNewDescription('');
                }
            };

            const handleSaveEdit = (sectionId) => {
                if (editData.title.trim()) {
                    onEditSection(project.id, sectionId, {
                        title: editData.title.trim(),
                        duration: editData.duration,
                        description: editData.description
                    });
                }
                setEditingId(null);
            };

            const sections = project.sections || [];
            const totalHours = sections.reduce((sum, sec) => sum + (parseFloat(sec.duration) || 0), 0);

            return (
                <div className="flex-1 flex flex-col w-full max-w-3xl mx-auto min-h-0 relative">
                    <header className="shrink-0 flex items-center gap-4 p-4 sm:p-6 pb-4 border-b border-slate-800">
                        <button onClick={onBack} className="p-2 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-full shrink-0">
                            <Icons.ArrowLeft />
                        </button>
                        <div className="flex-1 min-w-0">
                            <h1 className="text-2xl sm:text-3xl font-bold text-slate-100 truncate">{project.name}</h1>
                            {totalHours > 0 && (
                                <div className="flex items-center gap-1 text-slate-400 mt-1 text-sm">
                                    <Icons.Clock /> Gesamtzeit: ~{totalHours} Stunden
                                </div>
                            )}
                        </div>
                    </header>

                    <div className="flex-1 overflow-y-auto min-h-0 p-4 sm:p-6">
                        {sections.length === 0 ? (
                            <div className="text-center py-12 text-slate-500">
                                Füge deinen ersten Projekt-Abschnitt hinzu.
                            </div>
                        ) : (
                            <div className="relative pl-6 sm:pl-8 pb-12">
                                <div className="absolute left-10 sm:left-12 top-6 bottom-6 w-0.5 bg-slate-700"></div>
                                <ul className="space-y-4 relative z-10">
                                    {sections.map((section, index) => (
                                        <li key={section.id} className="flex items-center gap-4 sm:gap-6 group">
                                            <button 
                                                onClick={() => onToggleSection(project.id, section.id, !section.completed)}
                                                className={`shrink-0 w-8 h-8 rounded-full border-2 flex items-center justify-center transition-all duration-300 relative z-10 shadow-lg ${
                                                    section.completed ? 'bg-blue-500 border-blue-500 text-slate-900 shadow-blue-500/30' : 'bg-slate-900 border-slate-500 text-transparent'
                                                }`}
                                            >
                                                <Icons.Check />
                                            </button>

                                            <div className={`flex-1 p-4 rounded-2xl border transition-all ${
                                                section.completed ? 'bg-slate-800/40 border-slate-700/50 opacity-60' : 'bg-slate-800 border-slate-600 shadow-md'
                                            }`}>
                                                {editingId === section.id ? (
                                                    <div className="flex flex-col gap-3">
                                                        <div className="flex gap-2">
                                                            <input type="text" value={editData.title} onChange={e => setEditData({...editData, title: e.target.value})} className="flex-1 min-w-0 bg-slate-900 border border-slate-700 text-slate-100 rounded-lg px-3 py-2 focus:border-blue-500 outline-none" placeholder="Titel"/>
                                                            <input type="number" step="0.5" min="0" value={editData.duration} onChange={e => setEditData({...editData, duration: e.target.value})} className="w-16 sm:w-20 shrink-0 bg-slate-900 border border-slate-700 text-slate-100 rounded-lg px-2 sm:px-3 py-2 text-center focus:border-blue-500 outline-none" placeholder="Std."/>
                                                        </div>
                                                        <textarea value={editData.description} onChange={e => setEditData({...editData, description: e.target.value})} className="w-full bg-slate-900 border border-slate-700 text-slate-100 rounded-lg px-3 py-2 text-sm focus:border-blue-500 outline-none" placeholder="Beschreibung / Notizen..." rows="2"></textarea>
                                                        <div className="flex gap-2 justify-end">
                                                            <button onClick={() => setEditingId(null)} className="px-3 py-1.5 text-sm text-slate-400">Abbrechen</button>
                                                            <button onClick={() => handleSaveEdit(section.id)} className="px-3 py-1.5 text-sm bg-blue-600 hover:bg-blue-500 text-white rounded-lg">Speichern</button>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div className="flex justify-between items-start">
                                                        <div className="flex flex-col flex-1 min-w-0 pr-2">
                                                            <span className={`text-lg font-medium transition-all ${section.completed ? 'line-through text-slate-500' : 'text-slate-100'}`}>
                                                                {section.title}
                                                            </span>
                                                            {section.duration && <span className="text-xs text-slate-400 mt-1 flex items-center gap-1"><Icons.Clock /> {section.duration} Std.</span>}
                                                            {section.description && <p className="text-sm text-slate-400 mt-2 whitespace-pre-wrap leading-relaxed">{section.description}</p>}
                                                        </div>
                                                        <div className="flex flex-col sm:flex-row gap-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity ml-2 shrink-0">
                                                            <button onClick={(e) => { e.stopPropagation(); onMoveSection(project.id, index, -1); }} disabled={index === 0} className="text-slate-500 hover:text-blue-400 disabled:opacity-20 p-2"><Icons.ArrowUp /></button>
                                                            <button onClick={(e) => { e.stopPropagation(); onMoveSection(project.id, index, 1); }} disabled={index === sections.length - 1} className="text-slate-500 hover:text-blue-400 disabled:opacity-20 p-2"><Icons.ArrowDown /></button>
                                                            <button onClick={() => { setEditingId(section.id); setEditData({ title: section.title, duration: section.duration || '', description: section.description || '' }); }} className="text-slate-500 hover:text-blue-400 p-2"><Icons.Edit /></button>
                                                            <button onClick={() => onDeleteSection(project.id, section.id)} className="text-slate-500 hover:text-red-400 p-2"><Icons.Trash /></button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        )}
                    </div>

                    <div className="shrink-0 p-4 border-t border-slate-800 bg-slate-900">
                        <form onSubmit={handleAdd} className="flex flex-col gap-2">
                            <div className="flex gap-2 sm:gap-3">
                                <input type="text" value={newTitle} onChange={(e) => setNewTitle(e.target.value)} placeholder="Neuer Abschnitt..." className="flex-1 min-w-0 bg-slate-800 border border-slate-700 text-slate-100 rounded-xl px-3 sm:px-4 py-3 focus:border-blue-500 outline-none text-base" />
                                <input type="number" step="0.5" min="0" value={newDuration} onChange={(e) => setNewDuration(e.target.value)} placeholder="Std." className="w-16 sm:w-20 shrink-0 bg-slate-800 border border-slate-700 text-slate-100 rounded-xl px-2 sm:px-3 py-3 focus:border-blue-500 outline-none text-center text-base" />
                                <button type="submit" disabled={!newTitle.trim()} className="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white px-4 sm:px-6 py-3 rounded-xl shrink-0"><Icons.Plus /></button>
                            </div>
                            <input type="text" value={newDescription} onChange={(e) => setNewDescription(e.target.value)} placeholder="Optionale Beschreibung / Notizen..." className="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded-xl px-4 py-2 text-base focus:border-blue-500 outline-none" />
                        </form>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [projects, setProjects] = useState([]);
            const [currentProjectId, setCurrentProjectId] = useState(null);
            const [loading, setLoading] = useState(true);
            
            // Sync & Cloud Status
            const [syncCode, setSyncCode] = useState('');
            const [syncStatus, setSyncStatus] = useState('connecting'); // connecting, connected, error
            const [isSyncModalOpen, setIsSyncModalOpen] = useState(false);
            
            // Firebase Instanzen
            const [dbInstance, setDbInstance] = useState(null);
            const [appIdStr, setAppIdStr] = useState('');

            const sortProjects = (projList) => {
                return [...projList].sort((a, b) => {
                    const urgA = a.urgency || 3;
                    const urgB = b.urgency || 3;
                    if (urgA !== urgB) return urgA - urgB;
                    return b.createdAt - a.createdAt;
                });
            };

            // Init oder Laden des Sync-Codes beim Start
            useEffect(() => {
                let code = localStorage.getItem('makerboard_sync_code');
                if (!code) {
                    code = Math.random().toString(36).substring(2, 8).toUpperCase(); // Zufälliger 6-stelliger Code
                    localStorage.setItem('makerboard_sync_code', code);
                }
                setSyncCode(code);
            }, []);

            // Initialisiere Firebase Cloud Sync, sobald Sync-Code bereit ist
            useEffect(() => {
                if (!syncCode) return;
                
                let unsubscribe = null;
                let isMounted = true;

                const initFirebase = async () => {
                    if (!window.FB) {
                        if (isMounted) setTimeout(initFirebase, 100);
                        return;
                    }
                    
                    const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, onSnapshot, collection } = window.FB;
                    
                    // Fallback Config, falls extern keine übergeben wurde
                    const fbConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
                        apiKey: "AIzaSyCXDryC4C6ii9eacgtj_ALN_wsLxL-bwiw",
                        authDomain: "makerboard-488ad.firebaseapp.com",
                        projectId: "makerboard-488ad",
                        storageBucket: "makerboard-488ad.firebasestorage.app",
                        messagingSenderId: "663732219493",
                        appId: "1:663732219493:web:36e2b59cd6e7437213608c"
                    };
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'makerboard-sync';
                    const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

                    try {
                        const app = initializeApp(fbConfig);
                        const auth = getAuth(app);
                        const db = getFirestore(app);

                        // Authentifizierung durchführen
                        if (initialToken) {
                            await signInWithCustomToken(auth, initialToken).catch(() => signInAnonymously(auth));
                        } else {
                            await signInAnonymously(auth);
                        }

                        if (!isMounted) return;

                        setDbInstance(db);
                        setAppIdStr(appId);

                        // Sync-Daten lauschen. Alle Projekte dieses Sync-Codes liegen im gleichen "Workspace"
                        const collectionName = `board_${syncCode}`;
                        const projectsRef = collection(db, 'artifacts', appId, 'public', 'data', collectionName);
                        
                        unsubscribe = onSnapshot(projectsRef, (snapshot) => {
                            const loadedProjects = [];
                            snapshot.forEach(doc => loadedProjects.push({ id: doc.id, ...doc.data() }));
                            setProjects(sortProjects(loadedProjects));
                            setSyncStatus('connected');
                            setLoading(false);
                        }, (err) => {
                            console.error("Firestore Error:", err);
                            setSyncStatus('error');
                            setLoading(false);
                        });

                    } catch (e) {
                        console.error("Firebase Init Error:", e);
                        if (isMounted) {
                            setSyncStatus('error');
                            setLoading(false);
                        }
                    }
                };

                setSyncStatus('connecting');
                setLoading(true);
                initFirebase();

                return () => {
                    isMounted = false;
                    if (unsubscribe) unsubscribe();
                };
            }, [syncCode]);

            const handleApplySyncCode = (newCode) => {
                localStorage.setItem('makerboard_sync_code', newCode);
                setSyncCode(newCode);
                setCurrentProjectId(null); 
            };

            const saveProjectToCloud = async (projectData) => {
                if (!dbInstance || !appIdStr || syncStatus !== 'connected') return;
                try {
                    const { doc, setDoc } = window.FB;
                    const docRef = doc(dbInstance, 'artifacts', appIdStr, 'public', 'data', `board_${syncCode}`, projectData.id);
                    await setDoc(docRef, projectData);
                } catch(e) {
                    console.error("Fehler beim Cloud-Speichern:", e);
                }
            };

            const deleteProjectFromCloud = async (projectId) => {
                if (!dbInstance || !appIdStr || syncStatus !== 'connected') return;
                try {
                    const { doc, deleteDoc } = window.FB;
                    const docRef = doc(dbInstance, 'artifacts', appIdStr, 'public', 'data', `board_${syncCode}`, projectId);
                    await deleteDoc(docRef);
                } catch(e) {
                    console.error("Fehler beim Cloud-Löschen:", e);
                }
            };

            // Daten-Operationen
            const handleCreateProject = (name, urgency) => {
                const newProject = { id: crypto.randomUUID(), name, urgency, createdAt: Date.now(), sections: [] };
                saveProjectToCloud(newProject);
                // Optimistisches Update
                setProjects(prev => sortProjects([newProject, ...prev]));
            };

            const handleDeleteProject = (id) => {
                deleteProjectFromCloud(id);
                setProjects(prev => prev.filter(p => p.id !== id));
                if (currentProjectId === id) setCurrentProjectId(null);
            };

            const handleEditProject = (id, updates) => {
                const project = projects.find(p => p.id === id);
                if (!project) return;
                const updated = { ...project, ...updates };
                saveProjectToCloud(updated);
                setProjects(prev => sortProjects(prev.map(p => p.id === id ? updated : p)));
            };

            const handleAddSection = (projectId, title, duration, description) => {
                const project = projects.find(p => p.id === projectId);
                if (!project) return;
                const newSection = { id: crypto.randomUUID(), title, duration: duration || null, description: description || '', completed: false, createdAt: Date.now() };
                const updated = { ...project, sections: [...(project.sections || []), newSection] };
                saveProjectToCloud(updated);
                setProjects(prev => prev.map(p => p.id === projectId ? updated : p));
            };

            const handleEditSection = (projectId, sectionId, updates) => {
                const project = projects.find(p => p.id === projectId);
                if (!project) return;
                const updated = { ...project, sections: project.sections.map(sec => sec.id === sectionId ? { ...sec, ...updates } : sec) };
                saveProjectToCloud(updated);
                setProjects(prev => prev.map(p => p.id === projectId ? updated : p));
            };

            const handleToggleSection = (projectId, sectionId, isCompleted) => {
                const project = projects.find(p => p.id === projectId);
                if (!project) return;
                const updated = { ...project, sections: project.sections.map(sec => sec.id === sectionId ? { ...sec, completed: isCompleted } : sec) };
                saveProjectToCloud(updated);
                setProjects(prev => prev.map(p => p.id === projectId ? updated : p));
            };

            const handleDeleteSection = (projectId, sectionId) => {
                const project = projects.find(p => p.id === projectId);
                if (!project) return;
                const updated = { ...project, sections: project.sections.filter(sec => sec.id !== sectionId) };
                saveProjectToCloud(updated);
                setProjects(prev => prev.map(p => p.id === projectId ? updated : p));
            };

            const handleMoveSection = (projectId, index, direction) => {
                const project = projects.find(p => p.id === projectId);
                if (!project) return;
                const newSections = [...project.sections];
                const newIndex = index + direction;
                if (newIndex < 0 || newIndex >= newSections.length) return;
                
                const temp = newSections[index];
                newSections[index] = newSections[newIndex];
                newSections[newIndex] = temp;
                const updated = { ...project, sections: newSections };

                saveProjectToCloud(updated);
                setProjects(prev => prev.map(p => p.id === projectId ? updated : p));
            };

            if (loading) {
                return (
                    <div className="flex-1 flex flex-col items-center justify-center bg-slate-900 gap-4">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
                        <p className="text-slate-400 text-sm">Verbinde mit Sync-Workspace {syncCode}...</p>
                    </div>
                );
            }

            const currentProject = projects.find(p => p.id === currentProjectId);

            return (
                <div className="flex-1 w-full flex flex-col min-h-0 bg-slate-900">
                    {currentProjectId && currentProject ? (
                        <ProjectTimeline project={currentProject} onBack={() => setCurrentProjectId(null)} onAddSection={handleAddSection} onToggleSection={handleToggleSection} onDeleteSection={handleDeleteSection} onEditSection={handleEditSection} onMoveSection={handleMoveSection} />
                    ) : (
                        <Dashboard projects={projects} onCreateProject={handleCreateProject} onOpenProject={(proj) => setCurrentProjectId(proj.id)} onDeleteProject={handleDeleteProject} onEditProject={handleEditProject} onOpenSync={() => setIsSyncModalOpen(true)} syncStatus={syncStatus} />
                    )}
                    
                    <SyncModal 
                        isOpen={isSyncModalOpen} 
                        onClose={() => setIsSyncModalOpen(false)} 
                        syncCode={syncCode} 
                        onApplySyncCode={handleApplySyncCode} 
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
