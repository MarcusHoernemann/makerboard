/* =========================================================
   HILFSFUNKTIONEN
========================================================= */

function uuid() {

    if (crypto && crypto.randomUUID) {
        return crypto.randomUUID();
    }

    return "xxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(
        /[xy]/g,
        function(c) {

            const r =
                Math.random() * 16 | 0;

            const v =
                c === "x"
                    ? r
                    : (r & 0x3 | 0x8);

            return v.toString(16);
        }
    );
}


function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value == null
            ? ""
            : String(value);

    return div.innerHTML;
}


function formatDuration(ms) {

    if (!ms || ms < 0) {
        return "0 Min.";
    }

    const minutes =
        Math.floor(ms / 60000);

    if (minutes < 60) {
        return `${minutes} Min.`;
    }

    const hours =
        Math.floor(minutes / 60);

    const rest =
        minutes % 60;

    if (rest === 0) {
        return `${hours} Std.`;
    }

    return `${hours} Std. ${rest} Min.`;
}


function getActualWorkMs(section) {

    let total =
        Number(section.totalWorkMs) || 0;

    if (
        section.startedAt &&
        !section.pausedAt &&
        !section.completed &&
        !section.completedAt
    ) {

        total +=
            Math.max(
                0,
                now - Number(section.startedAt)
            );
    }

    return total;
}


function getProjectProgress(project) {

    const sections =
        project.sections || [];

    if (!sections.length) {
        return 0;
    }

    const completed =
        sections.filter(section =>
            section.completed ||
            section.completedAt
        ).length;

    return Math.round(
        completed / sections.length * 100
    );
}


function isProjectCompleted(project) {

    const sections =
        project.sections || [];

    return (
        sections.length > 0 &&
        sections.every(section =>
            section.completed ||
            section.completedAt
        )
    );
}


function sortProjects(projectList) {

    return [...projectList].sort((a, b) => {

        const completedA =
            isProjectCompleted(a);

        const completedB =
            isProjectCompleted(b);

        if (completedA !== completedB) {
            return completedA ? 1 : -1;
        }

        const urgencyA =
            Number(a.urgency) || 3;

        const urgencyB =
            Number(b.urgency) || 3;

        if (urgencyA !== urgencyB) {
            return urgencyA - urgencyB;
        }

        return (
            (b.createdAt || 0) -
            (a.createdAt || 0)
        );
    });
}


/* =========================================================
   ZEITSTRAHL
========================================================= */

function getTimelineHours(project) {

    const sections =
        project.sections || [];

    let maximumHours = 1;

    sections.forEach(section => {

        const plannedHours =
            Number(section.duration) || 1;

        const actualHours =
            getActualWorkMs(section) / 3600000;

        maximumHours =
            Math.max(
                maximumHours,
                plannedHours,
                actualHours
            );
    });

    return Math.max(1, Math.ceil(maximumHours));
}

function formatTimelineLabel(hours) {

    if (hours === 0) {
        return "0 Min.";
    }

    if (hours === 1) {
        return "1 Std.";
    }

    return `${hours} Std.`;
}


/* =========================================================
   APPLICATION STATE
========================================================= */

let projects = [];

let currentProjectId = null;

let syncCode =
    localStorage.getItem(
        "makerboard_sync_code"
    ) || "";

let unsubscribeProjects = null;
let currentUser = null;

let now = Date.now();

const collapsedProjects = {};
const collapsedSections = {};
const collapsedSchedules = {};


/* =========================================================
   PRIORITÄTEN
========================================================= */

const priorities = {

    1: {
        label: "Priorität 1",
        colorClass: "priority-1",
        badgeClass: "priority-badge-1",
        dotClass: "priority-dot-1"
    },

    2: {
        label: "Priorität 2",
        colorClass: "priority-2",
        badgeClass: "priority-badge-2",
        dotClass: "priority-dot-2"
    },

    3: {
        label: "Priorität 3",
        colorClass: "priority-3",
        badgeClass: "priority-badge-3",
        dotClass: "priority-dot-3"
    },

    4: {
        label: "Priorität 4",
        colorClass: "priority-4",
        badgeClass: "priority-badge-4",
        dotClass: "priority-dot-4"
    },

    5: {
        label: "Priorität 5",
        colorClass: "priority-5",
        badgeClass: "priority-badge-5",
        dotClass: "priority-dot-5"
    }
};


function getPriority(priority) {

    const value =
        Number(priority) || 3;

    return priorities[value] || priorities[3];
}


/* =========================================================
   FIREBASE SYNCHRONISIERUNG (FESTER ARTIFACTS PFAD)
========================================================= */

function getCollectionRef() {

    if (!syncCode) {
        return null;
    }

    const cleanCode = syncCode.trim();

    return collection(
        db,
        "artifacts",
        appId,
        "public",
        "data",
        "board_" + cleanCode
    );
}


function subscribeToProjects() {

    if (unsubscribeProjects) {
        unsubscribeProjects();
        unsubscribeProjects = null;
    }

    if (!syncCode) {
        projects = [];
        render();
        return;
    }

    const ref = getCollectionRef();
    if (!ref) return;

    unsubscribeProjects = onSnapshot(
        ref,
        snapshot => {
            const list = [];
            snapshot.forEach(item => {
                list.push({
                    id: item.id,
                    ...item.data()
                });
            });

            projects = sortProjects(list);
            render();
        },
        error => {
            console.error("Firebase Sync Fehler:", error);
            showToast("Synchronisierung fehlgeschlagen: " + error.message, "error");
        }
    );
}


async function saveProject(project) {

    if (!syncCode) {
        showToast("Bitte zuerst einen vorhandenen Sync-Code eingeben.", "error");
        return;
    }

    try {
        const ref = doc(getCollectionRef(), project.id);
        await setDoc(ref, project);
    } catch (error) {
        console.error("Projekt konnte nicht gespeichert werden:", error);
        showToast("Speichern fehlgeschlagen: " + error.message, "error");
    }
}


async function removeProject(projectId) {

    if (!syncCode) {
        return;
    }

    try {
        await deleteDoc(doc(getCollectionRef(), projectId));
        showToast("Projekt gelöscht", "success");
    } catch (error) {
        console.error(error);
        showToast("Löschen fehlgeschlagen", "error");
    }
}


/* =========================================================
   FIREBASE AUTH
========================================================= */

onAuthStateChanged(
    auth,
    user => {
        currentUser = user;
        if (user && syncCode) {
            subscribeToProjects();
        }
    }
);

async function authenticate() {
    try {
        if (!auth.currentUser) {
            await signInAnonymously(auth);
        } else {
            currentUser = auth.currentUser;
            if (syncCode) {
                subscribeToProjects();
            }
        }
    } catch (error) {
        console.error("Firebase Auth Fehler:", error);
        showToast("Firebase-Anmeldung fehlgeschlagen: " + error.message, "error");
    }
}

authenticate();


/* =========================================================
   TOAST
========================================================= */

function showToast(
    message,
    type = "success"
) {

    const old =
        document.getElementById(
            "toast"
        );

    if (old) {
        old.remove();
    }

    const toast =
        document.createElement(
            "div"
        );

    toast.id =
        "toast";

    toast.className =
        "fixed bottom-5 right-5 z-[100] px-4 py-3 rounded-xl shadow-2xl " +
        (
            type === "error"
                ? "bg-red-600 text-white"
                : "bg-emerald-600 text-white"
        );

    toast.textContent =
        message;

    document.body.appendChild(
        toast
    );

    setTimeout(
        () => {

            if (toast.parentNode) {
                toast.remove();
            }

        },
        3000
    );
}

/* =========================================================
   TOGGLES
========================================================= */

function toggleProject(projectId) {
    collapsedProjects[projectId] = !collapsedProjects[projectId];
    render();
}

function toggleSchedule(projectId) {
    collapsedSchedules[projectId] = !collapsedSchedules[projectId];
    render();
}

function toggleSection(sectionId) {
    collapsedSections[sectionId] = !collapsedSections[sectionId];
    render();
}


/* =========================================================
   HTML RENDER
========================================================= */

function render() {

    const root =

    root.innerHTML = `

        <div class="min-h-screen bg-slate-950">

            <header class="sticky top-0 z-30 border-b border-slate-800 bg-slate-950/95 backdrop-blur">

                        <p class="text-xs text-slate-500 mt-1">

function renderSyncNotice() {

    return `

                    </button>

        </div>
    `;
}


function renderEmptyState() {

    return `

        <div class="min-h-[60vh] flex items-center justify-center">

            <div class="text-center max-w-md">

                <div class="text-6xl mb-5">

function renderSchedule(project) {

    const sections =
        project.sections || [];

    if (!sections.length) {

        return `

            <div class="rounded-xl border border-dashed border-slate-700 p-8 text-center text-slate-500">

                Noch keine Arbeitsschritte vorhanden.

            </div>
        `;
    }


    const totalHours =
        getTimelineHours(project);


    const hours = [];

    for (
        let h = 0;
        h <= totalHours;
        h++
    ) {
        hours.push(h);
    }


    return `

        <div class="rounded-xl overflow-hidden border border-slate-800">

            <div class="bg-slate-900">

                <div class="timeline-header">

                    <div class="timeline-header-label text-xs font-semibold text-slate-400">
                        ARBEITSSCHRITT
                    </div>


                    <div class="timeline-hours">

                        ${hours.map(hour => {

                            const left =
                                (
                                    hour /
                                    totalHours
                                ) * 100;

                            return `

                                <div
                                    class="hour-marker"
                                    style="left:${left}%">

                                    ${formatTimelineLabel(hour)}

                                </div>
                            `;

                        }).join("")}

                    </div>

                </div>


                <div class="timeline-grid">

                    ${sections.map(section =>
                        renderTimelineRow(
                            project.id,
                            section,
                            totalHours

                    ).join("")}

            </div>

        </div>


        <div class="flex flex-wrap items-center gap-4 mt-3 text-xs text-slate-500">

            <span class="flex items-center gap-2">

                <span class="w-3 h-3 rounded bg-blue-600"></span>
                Läuft
            </span>

            <span class="flex items-center gap-2">
                <span class="w-3 h-3 rounded bg-amber-600"></span>
                Pausiert
            </span>

            <span class="flex items-center gap-2">
                <span class="w-3 h-3 rounded bg-green-600"></span>
                Beendet
            </span>

        </div>
    `;
}


function renderTimelineRow(
    projectId,
    section,
    totalHours
) {

    const collapsed =
        collapsedSections[section.id] ?? true;


    const plannedDuration =
        Number(section.duration) || 1;


    const actualWorkMs =
        getActualWorkMs(section);


    let status =
        "planned";

    if (
        section.completed ||
        section.completedAt
    ) {

        status =
            "completed";

    } else if (
        section.pausedAt
    ) {

        status =
            "paused";

    } else if (
        section.startedAt
    ) {

        status =
            "active";
    }


    const durationHours =
        status === "planned"
            ? plannedDuration
            : Math.max(
                0.05,
                actualWorkMs / 3600000
            );


    let width =
        (
            durationHours /
            totalHours
        ) * 100;


    width =
        Math.max(
            1.2,
            Math.min(
                100,
                width
            )
        );


    let barClass =
        "task-bar-planned";

    if (status === "active") {
        barClass =
            "task-bar-active";
    }

    if (status === "paused") {
        barClass =
            "task-bar-paused";
    }

    if (status === "completed") {
        barClass =
            "task-bar-completed";
    }


    let statusText =
        "Geplant";

    if (status === "active") {

        statusText =
            "Läuft";

    } else if (status === "paused") {

        statusText =
            "Pausiert";

    } else if (status === "completed") {

        statusText =
            "Beendet";
    }


    const plannedText =
        `${plannedDuration} Std. geplant`;

    const actualText =
        `Tatsächlich: ${formatDuration(actualWorkMs)}`;


    let buttonHtml = "";


    if (status === "planned") {

        buttonHtml = `

            <button
                onclick="startSection('${projectId}', '${section.id}')"
                class="flex items-center gap-1 px-2 py-1 rounded-md bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold">

                ${icons.play}

                Starten

            </button>
        `;

    } else if (status === "active") {

        buttonHtml = `

            <button
                onclick="pauseSection('${projectId}', '${section.id}')"
                class="flex items-center gap-1 px-2 py-1 rounded-md bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold">

                ${icons.pause}

                Pause

            </button>


            <button
                onclick="completeSection('${projectId}', '${section.id}')"
                class="flex items-center gap-1 px-2 py-1 rounded-md bg-green-600 hover:bg-green-500 text-white text-xs font-semibold">

                ${icons.check}

                Beenden

            </button>
        `;

    } else if (status === "paused") {

        buttonHtml = `

            <button
                onclick="startSection('${projectId}', '${section.id}')"
                class="flex items-center gap-1 px-2 py-1 rounded-md bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold">

                ${icons.play}

                Fortsetzen

            </button>


            <button
                onclick="completeSection('${projectId}', '${section.id}')"
                class="flex items-center gap-1 px-2 py-1 rounded-md bg-green-600 hover:bg-green-500 text-white text-xs font-semibold">

                ${icons.check}

                Beenden

            </button>
        `;
    }


    return `

        <div class="timeline-row ${collapsed ? "collapsed" : ""}">

            <div class="timeline-label">

                <div class="flex items-center gap-2">

                    <button
                        onclick="toggleSection('${section.id}')"
                        class="shrink-0 p-1 rounded-md hover:bg-slate-800 text-slate-400">

                        ${
                            collapsed
                                ? icons.chevronRight
                                : icons.chevronDown
                        }

                    </button>


                    <div
                        class="font-medium text-sm text-slate-200 truncate"
                        title="${escapeHtml(section.title)}">

                        ${escapeHtml(section.title)}

                    </div>

                </div>


                <div class="flex items-center gap-2 mt-1 text-xs">

                    <span class="${
                        status === "active"
                            ? "text-blue-400"
                            : status === "paused"
                                ? "text-amber-400"
                                : status === "completed"
                                    ? "text-green-400"
                                    : "text-slate-500"
                    }">

                        ${statusText}

                    </span>

                </div>


                ${
                    collapsed
                        ? ""
                        : `

                            <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-500 mt-2">

                                <span>
                                    ${plannedText}
                                </span>

                                <span>
                                    ${actualText}
                                </span>

                            </div>


                            ${
                                section.description
                                    ? `
                                        <div class="text-xs text-slate-500 mt-2 line-clamp-2">
                                            ${escapeHtml(section.description)}
                                        </div>
                                    `
                                    : ""
                            }


                            <div class="flex gap-1 mt-2">

                                ${buttonHtml}


                                <button
                                    onclick="editSection('${projectId}', '${section.id}')"
                                    class="p-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-400">

                                    ${icons.edit}

                                </button>


                                <button
                                    onclick="deleteSection('${projectId}', '${section.id}')"
                                    class="p-1 rounded-md bg-slate-800 hover:bg-red-900/50 text-slate-400 hover:text-red-400">

                                    ${icons.trash}

                                </button>

                            </div>
                        `
                }

            </div>


            <div class="timeline-area">

                <div
                    class="task-bar ${barClass}"
                    style="
                        left:0%;
                        width:${width}%;
                    "
                    title="${escapeHtml(section.title)}">

                    ${
                        status !== "planned"
                            ? `
                                <span class="absolute inset-0 flex items-center px-3 text-xs font-semibold text-white truncate">

                                    ${
                                        status === "active"
                                            ? "Läuft"
                                            : status === "paused"
                                                ? "Pausiert"
                                                : "Beendet"
                                    }

                                </span>
                            `
                            : ""
                    }

                </div>

            </div>

        </div>
    `;
}

async function saveProjectForm(
    event,
    projectId
) {

    event.preventDefault();

    const name =
        document
            .getElementById(

            .value
            .trim();

    const urgency =
        Number(
            document
                .getElementById(
                    "project-urgency"
                )
                .value
        );

    if (!name) {
        return;
    }

    let project;

    if (projectId) {
        const old =
            projects.find(
                p => p.id === projectId
            );

        project = {
            ...old,
            name,
            urgency
        };
    } else {
        project = {
            id: uuid(),
            name,
            urgency,
            createdAt: Date.now(),
            sections: []
        };
    }

    closeModal();
    await saveProject(project);

    projects =
        sortProjects(
            projects
                .filter(
                    p => p.id !== project.id
                )
                .concat(project)
        );

    render();

    showToast(
        projectId
            ? "Projekt gespeichert"
            : "Projekt erstellt"
    );
}

async function saveSectionForm(
    event,
    projectId,
    sectionId
) {

    event.preventDefault();

    const project =
        projects.find(
            p => p.id === projectId
        );

    if (!project) {
        return;
    }

    const title =
        document
            .getElementById(
                "section-title"
            )
            .value
            .trim();

    const duration =
        Number(
            document
                .getElementById(
                    "section-duration"
                )
                .value
        ) || 1;

    const description =
        document
            .getElementById(
                "section-description"
            )
            .value
            .trim();

    if (!title) {
        return;
    }

    let sections = [
        ...(project.sections || [])
    ];

    if (sectionId) {
        sections = sections.map(section => {
            if (section.id !== sectionId) {
                return section;
            }
            return {
                ...section,
                title,
                duration,
                description
            };
        });
    } else {
        sections.push({
            id: uuid(),
            title,
            duration,
            description,
            completed: false,
            startedAt: null,
            pausedAt: null,
            completedAt: null,
            totalWorkMs: 0,
            createdAt: Date.now()
        });
    }

    const updated = {
        ...project,
        sections
    };

    closeModal();
    await saveProject(updated);

    projects =
        sortProjects(
            projects.map(
                p =>
                    p.id === projectId
                        ? updated
                        : p
            )
        );

    render();

    showToast(
        sectionId
            ? "Arbeitsschritt gespeichert"
            : "Arbeitsschritt hinzugefügt"
    );
}


/* =========================================================
   TASK STEUERUNG
========================================================= */

async function startSection(projectId, sectionId) {
    const project = projects.find(p => p.id === projectId);
    if (!project) return;

    const startedAt = Date.now();
    const updated = {
        ...project,
        sections: project.sections.map(section => {
            if (section.id !== sectionId) return section;
            return {
                ...section,
                completed: false,
                completedAt: null,
                pausedAt: null,
                startedAt,
                totalWorkMs: Number(section.totalWorkMs) || 0
            };
        })
    };

    await saveProject(updated);
    projects = sortProjects(projects.map(p => p.id === projectId ? updated : p));
    render();
    showToast("Arbeitsschritt gestartet");
}

async function pauseSection(projectId, sectionId) {
    const project = projects.find(p => p.id === projectId);
    if (!project) return;

    const pauseTime = Date.now();
    const updated = {
        ...project,
        sections: project.sections.map(section => {
            if (section.id !== sectionId) return section;

            let totalWorkMs = Number(section.totalWorkMs) || 0;
            if (section.startedAt && !section.pausedAt) {
                totalWorkMs += Math.max(0, pauseTime - Number(section.startedAt));
            }

            return {
                ...section,
                totalWorkMs,
                pausedAt: pauseTime,
                startedAt: null
            };
        })
    };

    await saveProject(updated);
    projects = sortProjects(projects.map(p => p.id === projectId ? updated : p));
    render();
    showToast("Arbeitsschritt pausiert");
}

async function completeSection(projectId, sectionId) {
    const project = projects.find(p => p.id === projectId);
    if (!project) return;

    const completedAt = Date.now();
    const updated = {
        ...project,
        sections: project.sections.map(section => {
            if (section.id !== sectionId) return section;

            let totalWorkMs = Number(section.totalWorkMs) || 0;
            if (section.startedAt && !section.pausedAt) {
                totalWorkMs += Math.max(0, completedAt - Number(section.startedAt));
            }

            return {
                ...section,
                totalWorkMs,
                completed: true,
                completedAt,
                pausedAt: null,
                startedAt: null
            };
        })
    };

    await saveProject(updated);
    projects = sortProjects(projects.map(p => p.id === projectId ? updated : p));
    render();
    showToast("Arbeitsschritt beendet");
}


/* =========================================================
   BEARBEITEN & LÖSCHEN
========================================================= */

function editProject(projectId) {
    openProjectModal(projectId);
}

function editSection(projectId, sectionId) {
    openSectionModal(projectId, sectionId);
}

async function deleteProject(projectId) {
    const project = projects.find(p => p.id === projectId);
    if (!project) return;

    if (!confirm(`Projekt "${project.name}" wirklich löschen?`)) {
        return;
    }

    await removeProject(projectId);
    projects = projects.filter(p => p.id !== projectId);
    render();
}

async function deleteSection(projectId, sectionId) {
    const project = projects.find(p => p.id === projectId);
    if (!project) return;

    const section = project.sections.find(s => s.id === sectionId);
    if (!section) return;

    if (!confirm(`Arbeitsschritt "${section.title}" wirklich löschen?`)) {
        return;
    }

    const updated = {
        ...project,
        sections: project.sections.filter(s => s.id !== sectionId)
    };

    await saveProject(updated);
    projects = sortProjects(projects.map(p => p.id === projectId ? updated : p));
    render();
}

   SETTINGS
========================================================= */

function openSettingsModal() {

    const modal = document.getElementById("modal-container");

    modal.innerHTML = `

        <div class="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4">

            <div class="w-full max-w-lg glass rounded-2xl shadow-2xl fade-in">

                <div class="p-5 border-b border-slate-800 flex items-center justify-between">

                    <h2 class="text-lg font-bold text-white">
                        Einstellungen
                    </h2>

                    <button
                        onclick="closeModal()"
                        class="p-2 rounded-lg hover:bg-slate-800 text-slate-400">
                        ${icons.close}
                    </button>

                </div>

                <form
                    onsubmit="saveSyncCode(event)"
                    class="p-5 space-y-5">

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">
                            Vorhandenen Sync-Code
                        </label>

                        <input
                            id="sync-code"
                            value="${escapeHtml(syncCode)}"
                            class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white outline-none focus:border-blue-500"
                            placeholder="z. B. mein-makerboard-2026">

                        <p class="text-xs text-slate-500 mt-2">
                            Verwende den bereits vorhandenen Code deiner Datenbank.
                            Auf allen Geräten mit demselben Code werden dieselben Projekte geladen.
                        </p>
                    </div>

                    <div class="rounded-xl bg-slate-900 border border-slate-800 p-4">
                        <div class="text-sm font-semibold text-white">
                            Synchronisation
                        </div>
                        <div class="text-xs text-slate-500 mt-1">
                            ${
                                syncCode
                                    ? "Aktiver Sync-Code: " + escapeHtml(syncCode)
                                    : "Kein Sync-Code ausgewählt."
                            }
                        </div>
                    </div>

                    <div class="flex justify-end gap-2">
                        <button
                            type="button"
                            onclick="closeModal()"
                            class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300">
                            Abbrechen
                        </button>

                        <button
                            type="submit"
                            class="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold">
                            Speichern
                        </button>
                    </div>

                </form>

            </div>

        </div>
    `;
}

async function saveSyncCode(event) {
    event.preventDefault();

    const input = document.getElementById("sync-code");
    const value = input.value.trim();

    if (!value) {
        showToast("Bitte einen vorhandenen Sync-Code eingeben.", "error");
        return;
    }

    syncCode = value;
    localStorage.setItem("makerboard_sync_code", syncCode);

    closeModal();
    subscribeToProjects();
    showToast("Sync-Code übernommen");
}

function closeModal() {
    const modal = document.getElementById("modal-container");
    if (modal) modal.innerHTML = "";
}


/* =========================================================
   GLOBALE WINDOW REGISTRIERUNG
========================================================= */

window.openProjectModal = openProjectModal;
window.openSettingsModal = openSettingsModal;
window.openSectionModal = openSectionModal;
window.saveProjectForm = saveProjectForm;
window.saveSectionForm = saveSectionForm;
window.saveSyncCode = saveSyncCode;
window.startSection = startSection;
window.pauseSection = pauseSection;
window.completeSection = completeSection;
window.editProject = editProject;
window.editSection = editSection;
window.deleteProject = deleteProject;
window.deleteSection = deleteSection;
window.toggleProject = toggleProject;
window.toggleSchedule = toggleSchedule;
window.toggleSection = toggleSection;
window.closeModal = closeModal;


/* =========================================================
   ZEIT AKTUALISIEREN & INITIAL RENDER
========================================================= */

setInterval(() => {
    now = Date.now();
    const activeSections = projects.some(project =>
        (project.sections || []).some(section =>
            section.startedAt && !section.pausedAt && !section.completed && !section.completedAt
        )
    );
    if (activeSections) {
        render();
    }
}, 30000);

render();

</script>
