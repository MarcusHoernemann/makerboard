<script type="module">

/* =========================================================

} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const fbConfig = {
    apiKey: "AIzaSyCXDryC4C6ii9eacgtj_ALN_wsLxL-bwiw",
    authDomain: "makerboard-488ad.firebaseapp.com",
    projectId: "makerboard-488ad",
    storageBucket: "makerboard-488ad.firebasestorage.app",
    messagingSenderId: "663732219493",
    appId: "1:663732219493:web:36e2b59cd6e7437213608c"
};

const firebaseApp = initializeApp(fbConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

/* =========================================================
   HILFSFUNKTIONEN
========================================================= */

function uuid() {

    if (crypto && crypto.randomUUID) {
        return crypto.randomUUID();
    }

    return "xxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(
        /[xy]/g,
        function(c) {

            const r =
                Math.random() * 16 | 0;

            const v =
                c === "x"
                    ? r
                    : (r & 0x3 | 0x8);

            return v.toString(16);
        }
    );
}

function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value == null
            ? ""
            : String(value);

    return div.innerHTML;
}

function formatDuration(ms) {

    if (!ms || ms < 0) {
        return "0 Min.";
    }

    const minutes =
        Math.floor(ms / 60000);

    if (minutes < 60) {
        return `${minutes} Min.`;
    }

    const hours =
        Math.floor(minutes / 60);

    const rest =
        minutes % 60;

    if (rest === 0) {
        return `${hours} Std.`;
    }

    return `${hours} Std. ${rest} Min.`;
}

function getActualWorkMs(section) {

    let total =
        Number(section.totalWorkMs) || 0;

    if (
        section.startedAt &&
        !section.pausedAt &&
        !section.completed &&
        !section.completedAt
    ) {

        total +=
            Math.max(
                0,
                now - Number(section.startedAt)
            );
    }

    return total;
}

function getProjectProgress(project) {

    const sections =
        project.sections || [];

    if (!sections.length) {
        return 0;
    }

    const completed =
        sections.filter(section =>
            section.completed ||
            section.completedAt
        ).length;

    return Math.round(
        completed / sections.length * 100
    );
}

function isProjectCompleted(project) {

    const sections =
        project.sections || [];

    return (
        sections.length > 0 &&
        sections.every(section =>
            section.completed ||
            section.completedAt
        )
    );
}

function sortProjects(projectList) {

    return [...projectList].sort((a, b) => {

        const completedA =
            isProjectCompleted(a);

        const completedB =
            isProjectCompleted(b);

        if (completedA !== completedB) {
            return completedA ? 1 : -1;
        }

        const urgencyA =
            Number(a.urgency) || 3;

        const urgencyB =
            Number(b.urgency) || 3;

        if (urgencyA !== urgencyB) {
            return urgencyA - urgencyB;
        }

        return (
            (b.createdAt || 0) -
            (a.createdAt || 0)
        );
    });
}

/* =========================================================
   ZEITSTRAHL - DYNAMISCHE SKALIERUNG
========================================================= */

function getTimelineHours(project) {

    const sections =
        project.sections || [];

    let maximumHours = 1;

    sections.forEach(section => {

        const plannedHours =
            Number(section.duration) || 1;

        const actualHours =
            getActualWorkMs(section) / 3600000;

        maximumHours =
            Math.max(
                maximumHours,
                plannedHours,
                actualHours
            );
    });

    return Math.max(1, Math.ceil(maximumHours));
}

function getTimelineStep(totalHours) {
    if (totalHours <= 8) return 1;
    if (totalHours <= 16) return 2;
    if (totalHours <= 40) return 4;
    if (totalHours <= 80) return 8;
    return 12;
}

function getTimelineMarkers(totalHours) {
    const step = getTimelineStep(totalHours);
    const markers = [];

    for (let h = 0; h <= totalHours; h += step) {
        markers.push(h);
    }

    if (markers[markers.length - 1] !== totalHours) {
        markers.push(totalHours);
    }

    return markers;
}

function formatTimelineLabel(hours) {
    if (hours === 0) return "0h";
    return `${hours}h`;
}

/* =========================================================
   APPLICATION STATE
========================================================= */

let projects = [];
let currentProjectId = null;
let unsubscribeProjects = null;

let now = Date.now();

const collapsedProjects = {};
const collapsedSections = {};
const collapsedSchedules = {};

/* =========================================================
   PRIORITÄTEN
========================================================= */

const priorities = {

    1: {
        label: "Priorität 1",
        colorClass: "priority-1",
        badgeClass: "priority-badge-1",
        dotClass: "priority-dot-1"
    },

    2: {
        label: "Priorität 2",
        colorClass: "priority-2",
        badgeClass: "priority-badge-2",
        dotClass: "priority-dot-2"
    },

    3: {
        label: "Priorität 3",
        colorClass: "priority-3",
        badgeClass: "priority-badge-3",
        dotClass: "priority-dot-3"
    },

    4: {
        label: "Priorität 4",
        colorClass: "priority-4",
        badgeClass: "priority-badge-4",
        dotClass: "priority-dot-4"
    },

    5: {
        label: "Priorität 5",
        colorClass: "priority-5",
        badgeClass: "priority-badge-5",
        dotClass: "priority-dot-5"
    }
};

function getPriority(priority) {

    const value =
        Number(priority) || 3;

    return priorities[value] || priorities[3];
}

/* =========================================================
   FIREBASE SYNCHRONISATION (/projects)
========================================================= */

function getCollectionRef() {
    return collection(db, "projects");
}

function subscribeToProjects() {

    if (unsubscribeProjects) {
        unsubscribeProjects();
        unsubscribeProjects = null;
    }

    const colRef = getCollectionRef();

    unsubscribeProjects = onSnapshot(
        colRef,
        snapshot => {
            const list = [];

            snapshot.forEach(item => {
                const data = item.data();

                list.push({
                    id: item.id,
                    name: data.name || data.title || "Unbenanntes Projekt",
                    urgency: data.urgency ?? data.priority ?? 3,
                    createdAt: data.createdAt || 0,
                    sections: data.sections || data.tasks || [],
                    ...data
                });
            });

            projects = sortProjects(list);
            render();
        },
        error => {
            console.error("[Makerboard] Firestore Sync Fehler:", error);
            showToast("Fehler beim Laden: " + error.message, "error");
        }
    );
}

async function saveProject(project) {
    try {
        const ref = doc(getCollectionRef(), project.id);
        await setDoc(ref, project);
    } catch (error) {
        console.error("[Makerboard] Fehler beim Speichern:", error);
        showToast("Speichern fehlgeschlagen: " + error.message, "error");
    }
}

async function removeProject(projectId) {
    try {
        await deleteDoc(doc(getCollectionRef(), projectId));
        showToast("Projekt gelöscht", "success");
    } catch (error) {
        console.error("[Makerboard] Fehler beim Löschen:", error);
        showToast("Löschen fehlgeschlagen", "error");
    }
}

/* =========================================================
   FIREBASE AUTH
========================================================= */

onAuthStateChanged(
    auth,
    user => {
        if (user) {
            subscribeToProjects();
        }
    }
);

async function authenticate() {
    try {
        if (!auth.currentUser) {
            await signInAnonymously(auth);
        } else {
            subscribeToProjects();
        }
    } catch (error) {
        console.error("[Makerboard] Auth Fehler:", error);
        subscribeToProjects();
    }
}

authenticate();

/* =========================================================
   TOAST
========================================================= */

function showToast(
    message,
    type = "success"
) {

    const old =
        document.getElementById(
            "toast"
        );

    if (old) {
        old.remove();
    }

    const toast =
        document.createElement(
            "div"
        );

    toast.id =
        "toast";

    toast.className =
        "fixed bottom-5 right-5 z-[100] px-4 py-3 rounded-xl shadow-2xl " +
        (
            type === "error"
                ? "bg-red-600 text-white"
                : "bg-emerald-600 text-white"
        );

    toast.textContent =
        message;

    document.body.appendChild(
        toast
    );

    setTimeout(
        () => {

            if (toast.parentNode) {
                toast.remove();
            }

        },
        3000
    );
}

/* =========================================================
   ICONS
========================================================= */

const icons = {

    `,

};

/* =========================================================
   TOGGLES
========================================================= */

function toggleProject(projectId) {
    collapsedProjects[projectId] = !collapsedProjects[projectId];
    render();
}

function toggleSchedule(projectId) {
    collapsedSchedules[projectId] = !collapsedSchedules[projectId];
    render();
}

function toggleSection(sectionId) {
    collapsedSections[sectionId] = !collapsedSections[sectionId];
    render();
}

/* =========================================================
   HTML RENDER
========================================================= */

function render() {

    const root =
        document.getElementById(
            "root"
        );

    root.innerHTML = `

        <div class="min-h-screen bg-slate-950">

            <header class="sticky top-0 z-30 border-b border-slate-800 bg-slate-950/95 backdrop-blur">

                <div class="max-w-7xl mx-auto px-4 py-3 sm:py-4 flex items-center justify-between gap-4">

                    <div>

                        <h1 class="text-xl sm:text-2xl font-bold text-white">
                            Makerboard
                        </h1>

                        <p class="text-xs text-slate-500 mt-0.5">
                            ${projects.length} Projekt${projects.length === 1 ? "" : "e"} synchronisiert
                        </p>

                    </div>

                    <div class="flex items-center gap-2">

                        <button
                            onclick="openProjectModal()"
                            class="flex items-center gap-1.5 sm:gap-2 px-3 sm:px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition">

                            ${icons.plus}

                            <span>
                                Neues Projekt
                            </span>

                        </button>

                    </div>

                </div>

            </header>

            <main class="max-w-7xl mx-auto px-3 sm:px-4 py-4 sm:py-6">

                ${
                    projects.length
                        ? projects
                            .map(renderProject)
                            .join("")
                        : renderEmptyState()
                }

            </main>

        </div>

        <div id="modal-container"></div>
    `;
}

function renderEmptyState() {

    return `

        <div class="min-h-[60vh] flex items-center justify-center">

            <div class="text-center max-w-md p-4">

                <div class="text-5xl sm:text-6xl mb-4 sm:mb-5">
                    🛠️
                </div>

                <h2 class="text-xl sm:text-2xl font-bold text-white">
                    Keine Projekte vorhanden
                </h2>

                <p class="text-slate-400 text-sm mt-2">
                    Erstelle dein erstes Projekt und teile es in einzelne Arbeitsschritte auf.
                </p>

                <button
                    onclick="openProjectModal()"
                    class="mt-6 inline-flex items-center gap-2 px-5 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm">

                    ${icons.plus}

                    Erstes Projekt erstellen

                </button>

            </div>

        </div>
    `;
}

function renderProject(project) {

    const progress =
        getProjectProgress(project);

    const completed =
        isProjectCompleted(project);

    const collapsed =
        collapsedProjects[project.id] ?? false;

    const priority =
        getPriority(project.urgency);

    const scheduleCollapsed =
        collapsedSchedules[project.id] ?? false;

    const sectionCount =
        project.sections?.length || 0;

    return `

        <section
            class="glass rounded-2xl overflow-hidden mb-4 sm:mb-6 fade-in">

            <div class="p-3.5 sm:p-5">

                <div class="flex items-center gap-2.5 sm:gap-3">

                    <button
                        onclick="toggleProject('${project.id}')"
                        class="shrink-0 p-1.5 sm:p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">

                        ${
                            collapsed
                                ? icons.chevronRight
                                : icons.chevronDown
                        }

                    </button>

                    <button
                        onclick="toggleProject('${project.id}')"
                        class="min-w-0 flex-1 text-left">

                        <div class="flex flex-wrap items-center gap-2">

                            <h2 class="text-lg sm:text-xl font-bold text-white truncate">
                                ${escapeHtml(project.name)}
                            </h2>

                            <span
                                class="px-2 py-0.5 rounded-full border text-[11px] sm:text-xs font-semibold ${priority.badgeClass}">

                                ${priority.label}

                            </span>

                            ${
                                completed
                                    ? `
                                        <span class="px-2 py-0.5 rounded-full text-[11px] sm:text-xs font-semibold bg-emerald-500/15 text-emerald-400">
                                            Abgeschlossen
                                        </span>
                                    `
                                    : ""
                            }

                        </div>

                        <div class="flex flex-wrap items-center gap-3 sm:gap-4 mt-1.5 text-xs sm:text-sm">

                            <span class="${priority.colorClass}">
                                ● ${priority.label}
                            </span>

                            <span class="text-slate-500">
                                ${sectionCount} Schritte
                            </span>

                            <span class="text-slate-500">
                                ${progress}% fertig
                            </span>

                        </div>

                    </button>

function renderSchedule(project) {

    const sections =
        project.sections || [];

    if (!sections.length) {

        return `

            <div class="rounded-xl border border-dashed border-slate-700 p-6 sm:p-8 text-center text-xs sm:text-sm text-slate-500">

                Noch keine Arbeitsschritte vorhanden.

            </div>
        `;
    }

    const totalHours =
        getTimelineHours(project);

    const markers =
        getTimelineMarkers(totalHours);

    // Auf Mobile min. 48px, auf Desktop min. 60px pro Stunde
    const hourWidth = window.innerWidth < 640 ? 48 : 60;
    const labelWidth = window.innerWidth < 640 ? 160 : 240;

    const dynamicAreaWidthPx =
        Math.max(window.innerWidth - labelWidth - 40, totalHours * hourWidth);

    return `

        <div class="rounded-xl border border-slate-800 overflow-hidden bg-slate-900">

            <div class="timeline-scroll-container">

                <div style="width: ${dynamicAreaWidthPx + labelWidth}px; min-width: 100%;">

                    <div class="timeline-header">

                        <div class="timeline-header-label text-xs font-semibold text-slate-400">
                            ARBEITSSCHRITT
                        </div>

                        <div class="timeline-hours" style="width: ${dynamicAreaWidthPx}px;">

                            ${markers.map(hour => {

                                const left =
                                    (
                                        hour /
                                        totalHours
                                    ) * 100;

                                return `

                                    <div
                                        class="hour-marker"
                                        style="left:${left}%;">

                                        ${formatTimelineLabel(hour)}

                                    </div>
                                `;

                            }).join("")}

                        </div>

                    </div>

                    <div class="timeline-rows">

                        ${sections.map(section =>
                            renderTimelineRow(
                                project.id,
                                section,
                                totalHours,
                                dynamicAreaWidthPx
                            )
                        ).join("")}

                    </div>

                </div>

            </div>

        </div>

        <div class="flex flex-wrap items-center justify-between gap-2 mt-2.5 text-[11px] sm:text-xs text-slate-500">

            <div class="flex items-center gap-3">
                <span class="flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded bg-slate-600"></span>
                    Geplant
                </span>

                <span class="flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded bg-blue-600"></span>
                    Läuft
                </span>

                <span class="flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded bg-amber-600"></span>
                    Pausiert
                </span>

                <span class="flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded bg-green-600"></span>
                    Beendet
                </span>
            </div>

            <div class="sm:hidden text-slate-400 italic">
                👉 Wischen für mehr Zeit
            </div>

        </div>
    `;
}

function renderTimelineRow(
    projectId,
    section,
    totalHours,
    dynamicAreaWidthPx
) {

    const collapsed =
        collapsedSections[section.id] ?? true;

    const plannedDuration =
        Number(section.duration) || 1;

    const actualWorkMs =
        getActualWorkMs(section);

    let status =
        "planned";

    if (
        section.completed ||
        section.completedAt
    ) {
        status = "completed";
    } else if (
        section.pausedAt
    ) {
        status = "paused";
    } else if (
        section.startedAt
    ) {
        status = "active";
    }

    const durationHours =
        status === "planned"
            ? plannedDuration
            : Math.max(
                0.05,
                actualWorkMs / 3600000
            );

    let width =
        (
            durationHours /
            totalHours
        ) * 100;

    width =
        Math.max(
            0.5,
            Math.min(
                100,
                width
            )
        );

    let barClass = "task-bar-planned";

    if (status === "active") {
        barClass = "task-bar-active";
    }

    if (status === "paused") {
        barClass = "task-bar-paused";
    }

    if (status === "completed") {
        barClass = "task-bar-completed";
    }

    let statusText = "Geplant";

    if (status === "active") {
        statusText = "Läuft";
    } else if (status === "paused") {
        statusText = "Pausiert";
    } else if (status === "completed") {
        statusText = "Beendet";
    }

    const plannedText =
        `${plannedDuration} Std.`;

    const actualText =
        `${formatDuration(actualWorkMs)}`;

    let buttonHtml = "";

    if (status === "planned") {
        buttonHtml = `
            <button
                onclick="startSection('${projectId}', '${section.id}')"
                class="flex items-center gap-1 px-2 py-1 rounded-md bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold">
                ${icons.play}
                Start
            </button>
        `;
    } else if (status === "active") {
        buttonHtml = `
            <button
                onclick="pauseSection('${projectId}', '${section.id}')"
                class="flex items-center gap-1 px-2 py-1 rounded-md bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold">
                ${icons.pause}
                Pause
            </button>

            <button
                onclick="completeSection('${projectId}', '${section.id}')"
                class="flex items-center gap-1 px-2 py-1 rounded-md bg-green-600 hover:bg-green-500 text-white text-xs font-semibold">
                ${icons.check}
                Ende
            </button>
        `;
    } else if (status === "paused") {
        buttonHtml = `
            <button
                onclick="startSection('${projectId}', '${section.id}')"
                class="flex items-center gap-1 px-2 py-1 rounded-md bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold">
                ${icons.play}
                Weiter
            </button>

            <button
                onclick="completeSection('${projectId}', '${section.id}')"
                class="flex items-center gap-1 px-2 py-1 rounded-md bg-green-600 hover:bg-green-500 text-white text-xs font-semibold">
                ${icons.check}
                Ende
            </button>
        `;
    }

    return `

        <div class="timeline-row ${collapsed ? "collapsed" : ""}">

            <div class="timeline-label">

                <div class="flex items-center gap-1.5">

                    <button
                        onclick="toggleSection('${section.id}')"
                        class="shrink-0 p-0.5 rounded hover:bg-slate-800 text-slate-400">

                        ${
                            collapsed
                                ? icons.chevronRight
                                : icons.chevronDown
                        }

                    </button>

                    <div
                        class="font-medium text-xs sm:text-sm text-slate-200 truncate"
                        title="${escapeHtml(section.title)}">

                        ${escapeHtml(section.title)}

                    </div>

                </div>

                <div class="flex items-center gap-1.5 mt-0.5 text-[11px] sm:text-xs">

                    <span class="${
                        status === "active"
                            ? "text-blue-400"
                            : status === "paused"
                                ? "text-amber-400"
                                : status === "completed"
                                    ? "text-green-400"
                                    : "text-slate-500"
                    }">

                        ${statusText}

                    </span>

                </div>

                ${
                    collapsed
                        ? ""
                        : `

                            <div class="flex flex-col gap-0.5 text-[11px] text-slate-500 mt-1.5">

                                <span>
                                    Soll: ${plannedText}
                                </span>

                                <span>
                                    Ist: ${actualText}
                                </span>

                            </div>

                            ${
                                section.description
                                    ? `
                                        <div class="text-[11px] text-slate-500 mt-1.5 line-clamp-2">
                                            ${escapeHtml(section.description)}
                                        </div>
                                    `
                                    : ""
                            }

                            <div class="flex flex-wrap gap-1 mt-2">

                                ${buttonHtml}

                                <button
                                    onclick="editSection('${projectId}', '${section.id}')"
                                    class="p-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-400">

                                    ${icons.edit}

                                </button>

                                <button
                                    onclick="deleteSection('${projectId}', '${section.id}')"
                                    class="p-1 rounded-md bg-slate-800 hover:bg-red-900/50 text-slate-400 hover:text-red-400">

                                    ${icons.trash}

                                </button>

                            </div>
                        `
                }

            </div>

            <div class="timeline-area" style="width: ${dynamicAreaWidthPx}px;">

                <div
                    class="task-bar ${barClass}"
                    style="
                        left:0%;
                        width:${width}%;
                    "
                    title="${escapeHtml(section.title)}">

                    ${
                        status !== "planned"
                            ? `
                                <span class="absolute inset-0 flex items-center px-2 sm:px-3 text-[11px] sm:text-xs font-semibold text-white truncate">

                                    ${
                                        status === "active"
                                            ? "Läuft"
                                            : status === "paused"
                                                ? "Pausiert"
                                                : "Beendet"
                                    }

                                </span>
                            `
                            : ""
                    }

                </div>

            </div>

        </div>
    `;
}

async function saveProjectForm(
    event,
    projectId
) {

    event.preventDefault();

    const name =
        document
            .getElementById(
                "project-name"
            )
            .value
            .trim();

    const urgency =
        Number(
            document
                .getElementById(
                    "project-urgency"
                )
                .value
        );

    if (!name) {
        return;
    }

    let project;

    if (projectId) {
        const old =
            projects.find(
                p => p.id === projectId
            );

        project = {
            ...old,
            name,
            urgency
        };
    } else {
        project = {
            id: uuid(),
            name,
            urgency,
            createdAt: Date.now(),
            sections: []
        };
    }

    closeModal();
    await saveProject(project);

    projects =
        sortProjects(
            projects
                .filter(
                    p => p.id !== project.id
                )
                .concat(project)
        );

    render();

    showToast(
        projectId
            ? "Projekt gespeichert"
            : "Projekt erstellt"
    );
}

async function saveSectionForm(
    event,
    projectId,
    sectionId
) {

    event.preventDefault();

    const project =
        projects.find(
            p => p.id === projectId
        );

    if (!project) {
        return;
    }

    const title =
        document
            .getElementById(
                "section-title"
            )
            .value
            .trim();

    const duration =
        Number(
            document
                .getElementById(
                    "section-duration"
                )
                .value
        ) || 1;

    const description =
        document
            .getElementById(
                "section-description"
            )
            .value
            .trim();

    if (!title) {
        return;
    }

    let sections = [
        ...(project.sections || [])
    ];

    if (sectionId) {
        sections = sections.map(section => {
            if (section.id !== sectionId) {
                return section;
            }
            return {
                ...section,
                title,
                duration,
                description
            };
        });
    } else {
        sections.push({
            id: uuid(),
            title,
            duration,
            description,
            completed: false,
            startedAt: null,
            pausedAt: null,
            completedAt: null,
            totalWorkMs: 0,
            createdAt: Date.now()
        });
    }

    const updated = {
        ...project,
        sections
    };

    closeModal();
    await saveProject(updated);

    projects =
        sortProjects(
            projects.map(
                p =>
                    p.id === projectId
                        ? updated
                        : p
            )
        );

    render();

    showToast(
        sectionId
            ? "Arbeitsschritt gespeichert"
            : "Arbeitsschritt hinzugefügt"
    );
}

/* =========================================================
   TASK STEUERUNG
========================================================= */

async function startSection(projectId, sectionId) {
    const project = projects.find(p => p.id === projectId);
    if (!project) return;

    const startedAt = Date.now();
    const updated = {
        ...project,
        sections: project.sections.map(section => {
            if (section.id !== sectionId) return section;
            return {
                ...section,
                completed: false,
                completedAt: null,
                pausedAt: null,
                startedAt,
                totalWorkMs: Number(section.totalWorkMs) || 0
            };
        })
    };

    await saveProject(updated);
    projects = sortProjects(projects.map(p => p.id === projectId ? updated : p));
    render();
    showToast("Arbeitsschritt gestartet");
}

async function pauseSection(projectId, sectionId) {
    const project = projects.find(p => p.id === projectId);
    if (!project) return;

    const pauseTime = Date.now();
    const updated = {
        ...project,
        sections: project.sections.map(section => {
            if (section.id !== sectionId) return section;

            let totalWorkMs = Number(section.totalWorkMs) || 0;
            if (section.startedAt && !section.pausedAt) {
                totalWorkMs += Math.max(0, pauseTime - Number(section.startedAt));
            }

            return {
                ...section,
                totalWorkMs,
                pausedAt: pauseTime,
                startedAt: null
            };
        })
    };

    await saveProject(updated);
    projects = sortProjects(projects.map(p => p.id === projectId ? updated : p));
    render();
    showToast("Arbeitsschritt pausiert");
}

async function completeSection(projectId, sectionId) {
    const project = projects.find(p => p.id === projectId);
    if (!project) return;

    const completedAt = Date.now();
    const updated = {
        ...project,
        sections: project.sections.map(section => {
            if (section.id !== sectionId) return section;

            let totalWorkMs = Number(section.totalWorkMs) || 0;
            if (section.startedAt && !section.pausedAt) {
                totalWorkMs += Math.max(0, completedAt - Number(section.startedAt));
            }

            return {
                ...section,
                totalWorkMs,
                completed: true,
                completedAt,
                pausedAt: null,
                startedAt: null
            };
        })
    };

    await saveProject(updated);
    projects = sortProjects(projects.map(p => p.id === projectId ? updated : p));
    render();
    showToast("Arbeitsschritt beendet");
}

/* =========================================================
   BEARBEITEN & LÖSCHEN
========================================================= */

function editProject(projectId) {
    openProjectModal(projectId);
}

function editSection(projectId, sectionId) {
    openSectionModal(projectId, sectionId);
}

async function deleteProject(projectId) {
    const project = projects.find(p => p.id === projectId);
    if (!project) return;

    if (!confirm(`Projekt "${project.name}" wirklich löschen?`)) {
        return;
    }

    await removeProject(projectId);
    projects = projects.filter(p => p.id !== projectId);
    render();
}

async function deleteSection(projectId, sectionId) {
    const project = projects.find(p => p.id === projectId);
    if (!project) return;

    const section = project.sections.find(s => s.id === sectionId);
    if (!section) return;

    if (!confirm(`Arbeitsschritt "${section.title}" wirklich löschen?`)) {
        return;
    }

    const updated = {
        ...project,
        sections: project.sections.filter(s => s.id !== sectionId)
    };

    await saveProject(updated);
    projects = sortProjects(projects.map(p => p.id === projectId ? updated : p));
    render();
}

function closeModal() {
    const modal = document.getElementById("modal-container");
    if (modal) modal.innerHTML = "";
}

/* =========================================================
   GLOBALE WINDOW REGISTRIERUNG
========================================================= */

window.openProjectModal = openProjectModal;
window.openSectionModal = openSectionModal;
window.saveProjectForm = saveProjectForm;
window.saveSectionForm = saveSectionForm;
window.startSection = startSection;
window.pauseSection = pauseSection;
window.completeSection = completeSection;
window.editProject = editProject;
window.editSection = editSection;
window.deleteProject = deleteProject;
window.deleteSection = deleteSection;
window.toggleProject = toggleProject;
window.toggleSchedule = toggleSchedule;
window.toggleSection = toggleSection;
window.closeModal = closeModal;

/* =========================================================
   ZEIT AKTUALISIEREN & INITIAL RENDER
========================================================= */

setInterval(() => {
    now = Date.now();
    const activeSections = projects.some(project =>
        (project.sections || []).some(section =>
            section.startedAt && !section.pausedAt && !section.completed && !section.completedAt
        )
    );
    if (activeSections) {
        render();
    }
}, 30000);

render();

</script>
